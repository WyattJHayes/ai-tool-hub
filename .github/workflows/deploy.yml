name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ''
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix next-src ci

      - name: Test, lint, and build root application
        run: |
          npm test -- --runInBand
          npm run lint
          npm run build

      - name: Verify Next.js application
        run: |
          node --test \
            next-src/tests/task-decision.test.mjs \
            next-src/tests/tools-query-state.test.mjs \
            next-src/tests/compare-selection.test.mjs \
            next-src/tests/data-loading-contract.test.mjs \
            next-src/tests/search-suggestions.test.mjs \
            next-src/tests/editorial-ui-contract.test.mjs \
            next-src/tests/carbon-theme-contract.test.mjs \
            next-src/tests/task-first-ui-contract.test.mjs
          npm --prefix next-src run lint
          npm --prefix next-src run build
          node --test scripts/next-audit-guard.test.mjs
          node scripts/next-audit-guard.mjs

      - name: Run Next.js API regressions
        run: |
          (cd next-src && HOSTNAME=127.0.0.1 PORT=4180 node .next/standalone/server.js) > /tmp/ai-tool-hub-next.log 2>&1 &
          next_pid=$!
          trap 'kill "$next_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4180/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/ai-tool-hub-next.log
              exit 1
            fi
            sleep 1
          done
          TEST_BASE_URL=http://127.0.0.1:4180 node next-src/tests/api-regressions.test.mjs

      - name: Verify server and resume optimizer
        run: |
          npm audit --omit=dev
          npm --prefix server audit --omit=dev
          node --test tools/resume-optimizer/tests/api-client-auth.test.cjs tools/resume-optimizer/tests/build-output.test.cjs

      - name: Run repository guards
        run: |
          git diff --check
          bash -n deploy/tencent-cloud/quick-deploy.sh deploy/tencent-cloud/release-lib.sh deploy/tencent-cloud/deploy.sh
          node --test scripts/deploy-behavior.test.mjs
          node scripts/dev-cache-guard.mjs
          node scripts/review-guard.mjs
          node scripts/review-regressions.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run resume optimizer acceptance
        run: |
          set -euo pipefail
          npm --prefix next-src run test:resume
          node --test next-src/tests/resume-ui-contract.test.mjs next-src/tests/resume-ui-profile.test.mjs next-src/tests/resume-entry.test.mjs
          npm --prefix next-src run lint
          export NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:4192
          export NEXT_PUBLIC_SUPABASE_ANON_KEY=resume-ui-qa-anon-key
          npm --prefix next-src run build
          mkdir -p next-src/.next/standalone/.next
          cp -R next-src/.next/static next-src/.next/standalone/.next/static
          if [ -d next-src/public ]; then
            cp -R next-src/public next-src/.next/standalone/public
          fi
          resume_log=/tmp/resume-ui-next.log
          next_pid=''
          cleanup_resume() {
            exit_status=$?
            trap - EXIT INT TERM
            if [ -n "$next_pid" ]; then
              kill "$next_pid" 2>/dev/null || true
              wait "$next_pid" 2>/dev/null || true
            fi
            if [ "$exit_status" -ne 0 ]; then
              cat "$resume_log"
            fi
            rm -f "$resume_log"
            exit "$exit_status"
          }
          trap cleanup_resume EXIT INT TERM
          (
            cd next-src
            exec env \
              HOSTNAME=127.0.0.1 \
              PORT=4181 \
              NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:4192 \
              SUPABASE_SERVICE_ROLE_KEY=resume-ui-qa-service-role \
              DEEPSEEK_API_KEY=resume-ui-qa-deepseek-key \
              DEEPSEEK_BASE_URL=http://127.0.0.1:4192 \
              DEEPSEEK_MODEL=resume-ui-qa-model \
              DAILY_QUOTA=20 \
              XDDPAY_APP_ID=resume-ui-disabled \
              XDDPAY_SECRET=resume-ui-disabled-secret \
              XDDPAY_GATEWAY=http://127.0.0.1:4192 \
              XDDPAY_NOTIFY_URL=http://127.0.0.1:4181/api/resume/payment/callback \
              node .next/standalone/server.js
          ) > "$resume_log" 2>&1 &
          next_pid=$!
          for attempt in $(seq 1 30); do
            if ! kill -0 "$next_pid" 2>/dev/null; then
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:4181/resume/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          export RESUME_SERVER_LOG="$resume_log"
          RESUME_UI_URL=http://127.0.0.1:4181 RESUME_QA_DIR=/tmp/resume-ui-qa node scripts/resume-ui-guard.mjs
          kill "$next_pid" 2>/dev/null || true
          wait "$next_pid" 2>/dev/null || true
          next_pid=''
          rm -f "$resume_log"
          trap - EXIT INT TERM
          node scripts/review-regressions.mjs
          git diff --check

      - name: Run Next.js task-first UI guard
        run: |
          set -euo pipefail
          task_log=/tmp/ai-tool-hub-task-first.log
          next_pid=''
          cleanup() {
            exit_status=$?
            trap - EXIT INT TERM
            if [ -n "$next_pid" ]; then
              kill "$next_pid" 2>/dev/null || true
              wait "$next_pid" 2>/dev/null || true
            fi
            if [ "$exit_status" -ne 0 ]; then
              cat "$task_log"
            fi
            rm -f "$task_log"
            exit "$exit_status"
          }
          trap cleanup EXIT INT TERM
          (
            cd next-src
            exec node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 4181
          ) > "$task_log" 2>&1 &
          next_pid=$!
          for attempt in $(seq 1 30); do
            if ! kill -0 "$next_pid" 2>/dev/null; then
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:4181/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          TASK_FIRST_UI_URL=http://127.0.0.1:4181 node scripts/task-first-ui-guard.mjs
          CARBON_THEME_URL=http://127.0.0.1:4181 CARBON_QA_DIR=/tmp/carbon-console-qa node scripts/carbon-theme-ui-guard.mjs
          kill "$next_pid" 2>/dev/null || true
          wait "$next_pid" 2>/dev/null || true
          next_pid=''
          rm -f "$task_log"
          trap - EXIT INT TERM

      - name: Run browser layout guard
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ai-tool-hub-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/ai-tool-hub-preview.log
              exit 1
            fi
            sleep 1
          done
          UI_GUARD_URL=http://127.0.0.1:4173/ node scripts/ui-layout-guard.mjs

  db-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Apply migrations and run SQL contracts
        working-directory: next-src
        run: |
          supabase start
          npm run test:db

  build-and-deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [test, db-contracts]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
