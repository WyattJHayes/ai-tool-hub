name: Supabase DB Push

# Manually-triggered production migration deploy.
#
# Why manual (workflow_dispatch) instead of auto-push on merge:
# schema changes to the production database should be a deliberate act by
# the resource owner, not a side effect of merging code.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – Supabase personal access token
#                            (dash → Account → Account Tokens)
#   SUPABASE_PROJECT_REF   – production project ref
#                            (dash → Project Settings → General → Reference ID)
#
# Usage:
#   1. Run workflow with dry_run=true (default): prints `migration list` and
#      the pending diff WITHOUT applying anything.
#   2. Review the log. This repo adopted the CLI mid-stream (001/002/
#      20260724 were applied by hand; the remote also carries versions
#      20260630134529 / 20260723124839 / 20260724004724 that predate this
#      repo's migration directory). First run with repair_history=true to
#      reconcile both sides, then dry-run again to confirm only genuinely
#      pending migrations remain.
#   3. Run with dry_run=false to apply.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run: show pending migrations without applying'
        type: boolean
        default: true
      repair_history:
        description: 'First mark pre-existing migrations as applied (mid-stream adoption)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-db-push
  cancel-in-progress: false

jobs:
  db-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: next-src
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Show migration state (local vs remote)
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Repair migration history (mid-stream adoption)
        if: ${{ inputs.repair_history }}
        run: |
          # The production database was built partly outside this repo's
          # migration directory. Mark the hand-applied versions as applied
          # and the remote-only versions as reverted (acknowledged, not
          # managed locally) so db push can proceed safely.
          supabase migration repair --status applied \
            001 002 20260724000741
          supabase migration repair --status reverted \
            20260630134529 20260723124839 20260724004724
          supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Dry-run push (show pending diff)
        if: ${{ inputs.dry_run }}
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Apply pending migrations
        if: ${{ !inputs.dry_run }}
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Post-push migration state
        if: ${{ !inputs.dry_run }}
        run: supabase migration list
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
