name: weihub

services:
  web:
    image: ai-resume-optimizer:latest
    build:
      context: ./source
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL is required}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY is required}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    container_name: weihub-app
    restart: unless-stopped
    env_file:
      - ${AI_TOOL_HUB_ENV_FILE:-/opt/ai-tool-hub/.env}
    environment:
      NODE_ENV: production
      PORT: "3100"
      HOSTNAME: 0.0.0.0
    expose:
      - "3100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      dgc-net:
        aliases:
          - weihub-app

networks:
  dgc-net:
    external: true
    name: ${DGC_NETWORK_NAME:-dramagenai-cloud_dgc-net}
