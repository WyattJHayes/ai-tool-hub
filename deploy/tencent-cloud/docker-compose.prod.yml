name: weihub

# Names only. Values are loaded at runtime from the mode-0600 env_file and are
# never Docker build arguments. XDDPAY variables remain unused while payment is
# fail-closed pending a provider-signed fixture.
x-private-runtime-env-keys:
  - SUPABASE_SERVICE_ROLE_KEY
  - DEEPSEEK_API_KEY
  - DEEPSEEK_BASE_URL
  - DEEPSEEK_MODEL
  - DAILY_QUOTA
  - XDDPAY_APP_ID
  - XDDPAY_SECRET
  - XDDPAY_GATEWAY
  - XDDPAY_NOTIFY_URL

services:
  web:
    image: ${AI_TOOL_HUB_IMAGE:-ai-resume-optimizer:latest}
    build:
      context: ${AI_TOOL_HUB_BUILD_CONTEXT:-./source}
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL is required}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY is required}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    container_name: weihub-app
    restart: unless-stopped
    env_file:
      - ${AI_TOOL_HUB_ENV_FILE:-/opt/ai-tool-hub/.env}
    environment:
      NODE_ENV: production
      PORT: "3100"
      HOSTNAME: 0.0.0.0
    expose:
      - "3100"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      dgc-net:
        aliases:
          - weihub-app

networks:
  dgc-net:
    external: true
    name: ${DGC_NETWORK_NAME:-dramagenai-cloud_dgc-net}
