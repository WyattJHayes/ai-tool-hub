# Canonical weihub.cloud virtual host for the dgc-nginx container.

server {
    listen 8080;
    listen [::]:8080;
    server_name weihub.cloud www.weihub.cloud;
    port_in_redirect off;
    absolute_redirect off;

    return 301 https://weihub.cloud$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name weihub.cloud www.weihub.cloud;
    port_in_redirect off;
    absolute_redirect off;

    ssl_certificate /etc/letsencrypt/live/weihub.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weihub.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /love {
        return 301 /love/;
    }

    location ^~ /love/ {
        alias /var/www/html/love/;
        index index.html;
        try_files $uri $uri/ /love/index.html;
    }

    # Clears legacy cached 301 redirects without deleting cookies or site data.
    location = /reset-domain-cache {
        add_header Clear-Site-Data '"cache"' always;
        add_header Cache-Control "no-store" always;
        return 302 https://weihub.cloud/?domain-cache-reset=1;
    }

    location / {
        proxy_pass http://weihub-app:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
